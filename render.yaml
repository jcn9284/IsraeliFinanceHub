services:
  # Backend API
  - type: web
    name: israeli-finance-backend
    runtime: python
    rootDir: server

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString

      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend Static Site
  - type: web
    name: israeli-finance-frontend
    runtime: static
    rootDir: client

    buildCommand: npm install && npm run build

    staticPublishPath: build

    envVars:
      - key: REACT_APP_API_URL
        value: https://israeli-finance-backend.onrender.com

databases:
  - name: finance-db
    plan: free
    region: oregon