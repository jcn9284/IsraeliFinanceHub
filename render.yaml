services:
  # Backend API
  - type: web
    name: israeli-finance-backend
    runtime: python
    rootDir: server

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString

      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend Static Site
  - type: static
    name: israeli-finance-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: israeli-finance-backend
          property: url

databases:
  - name: finance-db
    plan: free
    region: oregon